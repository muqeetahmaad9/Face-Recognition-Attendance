<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Face Recognition Attendance">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0603"/><stop offset="100%" stop-color="#2a1208"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.6" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="200" fill="url(#bg)"/>
  <path d="M120 30 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/><path d="M120 47 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/><path d="M120 64 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/><path d="M120 81 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/><path d="M120 98 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/><path d="M120 115 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/><path d="M120 132 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/><path d="M120 149 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/><path d="M120 166 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/><path d="M120 183 H780" stroke="#5c2a12" stroke-width="1" opacity="0.5"/>
  <rect x="150" y="44" width="86" height="66" fill="none" stroke="#ff7a1a" stroke-width="1.6" opacity="0.55"/><rect x="666" y="96" width="74" height="58" fill="none" stroke="#ff7a1a" stroke-width="1.6" opacity="0.55"/>
  <g fill="none" stroke="#ff7a1a" stroke-width="3">
    <path d="M110 44 V22 H150"/><path d="M750 22 H790 V44"/>
    <path d="M110 156 V178 H150"/><path d="M790 156 V178 H750"/>
  </g>
  <circle cx="450" cy="100" r="66" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.30"/>
  <path d="M450 26 V52 M450 148 V174 M376 100 H402 M498 100 H524" stroke="#00d9ff" stroke-width="1.4" opacity="0.6"/>
  <circle cx="820" cy="34" r="5" fill="#ff7a1a"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="838" y="39" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" fill="#ff7a1a" opacity="1.0" text-anchor="start" letter-spacing="1.0">REC</text>
  <text x="450" y="60" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#ff7a1a" opacity="0.8" text-anchor="middle" letter-spacing="2">&gt; attend --recognize live</text>
  <text x="450" y="95" font-family="Consolas, 'Courier New', monospace" font-size="29" font-weight="bold" fill="#ff7a1a" opacity="1.0" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">Face Recognition Attendance</text>
  <text x="450" y="121" font-family="Consolas, 'Courier New', monospace" font-size="13.5" font-weight="normal" fill="#00d9ff" opacity="0.92" text-anchor="middle" letter-spacing="1.0">Flask attendance system using live face recognition</text>
</svg>
